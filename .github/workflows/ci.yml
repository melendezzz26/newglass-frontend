name: Frontend CI and pinned backend E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Component tests
        run: npm run test:component
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEWGLASS_REQUIRE_POSTGRES: '1'
      PYTHON_DOTENV_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: frontend
      - name: Validate pinned backend SHA
        id: backend_ref
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < .github/backend-e2e.sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout backend for E2E
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: melendezzz26/newglass-backend
          ref: ${{ steps.backend_ref.outputs.sha }}
          path: backend
      - name: Verify checked-out backend SHA
        shell: bash
        run: test "$(git -C ../backend rev-parse HEAD)" = "${{ steps.backend_ref.outputs.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r ../backend/requirements.txt
          npm ci
      - name: Install isolated PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          echo "NEWGLASS_TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Install managed Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E desktop and mobile
        # The B02 migration smoke must start with an empty isolated database:
        # its --prepare downgrade intentionally rejects existing v2 rows.
        # Run it once in a fresh Playwright server, then run every other
        # critical E2E test in a second fresh server.
        run: node scripts/run-e2e-phases.js
      - name: Preserve E2E phase reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-phases-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/e2e-phases/
            frontend/playwright-report/e2e-phases/
          if-no-files-found: error
