name: Frontend CI and backend integration E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend ref for the isolated E2E suite
        type: choice
        options: [main, pinned]
        default: main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Component tests
        run: npm run test:component
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Validar build Staging sin publicar
        env:
          # URL sintética HTTPS: este gate solo valida el bundle y los assets.
          # El deployment usa vars.VITE_API_URL aprobado por separado.
          VITE_API_URL: https://api.example.invalid
        run: |
          npm run build:staging
          npm run check:staging
      - name: Audit production dependencies (EN-SEC-001, V-20)
        # Runs even if an earlier step failed, so both results are visible.
        # Fails on high or critical advisories in the dependencies shipped in
        # the bundle; devDependencies (test and build tooling) are excluded.
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEWGLASS_REQUIRE_POSTGRES: '1'
      PYTHON_DOTENV_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: frontend
      - name: Select backend ref
        id: backend_ref
        shell: bash
        env:
          BACKEND_SELECTION: ${{ inputs.backend || 'main' }}
        run: |
          case "$BACKEND_SELECTION" in
            main) ref=refs/heads/main ;;
            pinned)
              ref="$(tr -d '\r\n' < .github/backend-e2e.sha)"
              [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
              ;;
            *) exit 2 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout backend for E2E
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: melendezzz26/newglass-backend
          ref: ${{ steps.backend_ref.outputs.ref }}
          path: backend
      - name: Record exact backend commit
        shell: bash
        env:
          BACKEND_REF: ${{ steps.backend_ref.outputs.ref }}
        run: |
          sha="$(git -C ../backend rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$BACKEND_REF" != refs/heads/main ]]; then test "$sha" = "$BACKEND_REF"; fi
          mkdir -p test-results/e2e-phases
          printf '%s\n' "$sha" | tee test-results/e2e-phases/backend-sha.txt
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r ../backend/requirements.txt
          npm ci
      - name: Locate isolated PostgreSQL binaries
        shell: bash
        run: |
          # ubuntu-24.04 runners include PostgreSQL 16. Avoid apt network/DNS
          # unless the required server binaries really are absent.
          pg_bin="$(pg_config --bindir 2>/dev/null || true)"
          if [[ -z "$pg_bin" || ! -x "$pg_bin/initdb" || ! -x "$pg_bin/pg_ctl" ]]; then
            for candidate in /usr/lib/postgresql/*/bin; do
              if [[ -x "$candidate/initdb" && -x "$candidate/pg_ctl" ]]; then
                pg_bin="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$pg_bin" || ! -x "$pg_bin/initdb" || ! -x "$pg_bin/pg_ctl" ]]; then
            echo "Server binaries unavailable; installing PostgreSQL with apt retries."
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y postgresql libpq-dev
            pg_bin="$(pg_config --bindir)"
          fi
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          echo "Using verified PostgreSQL server binaries: $pg_bin"
          echo "NEWGLASS_TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Install managed Chromium
        # The ubuntu-24.04 runner already includes Chromium OS libraries.
        # --with-deps re-runs apt against azure.archive.ubuntu.com and can
        # fail on unrelated DNS outages before any browser test executes.
        # A missing library still fails when Playwright launches the browser.
        run: npx playwright install chromium
      - name: E2E desktop and mobile
        id: e2e_tests
        # B02 creates FF/V1 history at head, then checks a round-trip while
        # the isolated API is idle. Keep the phase free of incompatible V2 rows.
        run: node scripts/run-e2e-phases.js
      - name: Preserve E2E phase reports and diagnostics
        # On a setup failure there are no test artifacts to upload.
        # Still fail hard when E2E ran but did not produce its evidence.
        if: ${{ always() && (steps.e2e_tests.outcome == 'success' || steps.e2e_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-phases-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/e2e-phases/
            frontend/playwright-report/e2e-phases/
          if-no-files-found: error
